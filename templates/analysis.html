<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Analysis | SkillBridge AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">SkillBridge AI</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <main class="container">
        <section class="form-card">
            <h1>Resume Skill Analysis</h1>
            <p>Upload your resume and compare your skills with a job description.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="message">{{ message }}</div>
            {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('analysis') }}" enctype="multipart/form-data">

                <label for="resume">Upload Resume (PDF or DOCX)</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.docx" required>

                <label for="job_description">Job Description</label>
                <textarea id="job_description" name="job_description" rows="10"
                    placeholder="Paste the job description here..." required></textarea>

                <button type="submit" class="btn">
                    Analyze My Resume
                </button>
            </form>
        </section>
    </main>

</body>

</html>
